[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-zfjw-api"
version = "1.0.0"
description = "一个用于FIT教务系统的Python API包"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Lecheeel"},
]
maintainers = [
    {name = "Lecheeel"},
]
keywords = ["fit", "教务", "api", "教务系统"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.25.1",
    "rsa>=4.7",
    "pyquery>=1.4.3",
    "onnxruntime>=1.12.0",
    "opencv-python>=4.5.0",
    "pillow>=8.0.0",
    "numpy>=1.20.0",
]
requires-python = ">=3.6"

[project.urls]
Homepage = "https://github.com/Lecheeel/fit-zfjw-api"
Repository = "https://github.com/Lecheeel/fit-zfjw-api"
"Bug Reports" = "https://github.com/Lecheeel/fit-zfjw-api/issues"

[tool.setuptools]
packages = ["fit_zfjw_api"]

[tool.setuptools.package-data]
"fit_zfjw_api" = ["utils/ddddocr/*"]

[project.optional-dependencies]
server = ["flask>=2.0.0"]
dev = ["pytest>=6.0", "pytest-cov>=2.0"] 